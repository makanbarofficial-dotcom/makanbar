# انتشار خودکار سایت روی GitHub Pages با هر push روی شاخه main
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # کلید publishable عمومی است و در هر صورت داخل جاوااسکریپت سایت قرار می‌گیرد؛
      # امنیت داده‌ها با RLS دیتابیس تأمین می‌شود.
      NEXT_PUBLIC_SUPABASE_URL: https://zuyzbxytfguuuojlydfb.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_rJ4ATw9QHrmsIeVxn04OJw_m-fPvVCQ
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
